<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="40%" stop-color="#0a0000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </linearGradient>
    <linearGradient id="crimsonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc143c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#dc143c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dc143c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="radialGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#dc143c" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#8b0000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="75%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ff69b4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff69b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc143c"/>
      <stop offset="40%" stop-color="#ff69b4"/>
      <stop offset="70%" stop-color="#ff1493"/>
      <stop offset="100%" stop-color="#dc143c"/>
    </linearGradient>
    <linearGradient id="subtleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#dc143c" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ff69b4" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#dc143c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#radialGlow)"/>
  <rect width="1200" height="420" fill="url(#pinkGlow)"/>
  <rect x="0" y="0" width="1200" height="420" fill="url(#crimsonGlow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#subtleLine)"/>
  <rect x="0" y="418" width="1200" height="2" fill="url(#subtleLine)"/>

  <!-- Corner ornaments -->
  <g opacity="0.6">
    <path d="M20,20 L20,50 M20,20 L50,20" fill="none" stroke="#dc143c" stroke-width="1.5"/>
    <path d="M1180,20 L1180,50 M1180,20 L1150,20" fill="none" stroke="#dc143c" stroke-width="1.5"/>
    <path d="M20,400 L20,370 M20,400 L50,400" fill="none" stroke="#dc143c" stroke-width="1.5"/>
    <path d="M1180,400 L1180,370 M1180,400 L1150,400" fill="none" stroke="#dc143c" stroke-width="1.5"/>
  </g>

  <!-- Giant Clock Background -->
  <g transform="translate(850, 210)" opacity="0.25">
    <circle r="180" fill="none" stroke="#dc143c" stroke-width="1"/>
    <circle r="175" fill="none" stroke="#ff69b4" stroke-width="0.5" stroke-dasharray="3,5"/>
    <circle r="170" fill="none" stroke="#dc143c" stroke-width="2"/>
    <circle r="155" fill="none" stroke="#8b0000" stroke-width="0.5"/>
    
    <!-- Roman numerals -->
    <g fill="#dc143c" font-family="Georgia, serif" font-size="18" text-anchor="middle" dominant-baseline="central" opacity="0.7">
      <text x="0" y="-140">XII</text>
      <text x="70" y="-121">I</text>
      <text x="121" y="-70">II</text>
      <text x="140" y="0">III</text>
      <text x="121" y="70">IV</text>
      <text x="70" y="121">V</text>
      <text x="0" y="140">VI</text>
      <text x="-70" y="121">VII</text>
      <text x="-121" y="70">VIII</text>
      <text x="-140" y="0">IX</text>
      <text x="-121" y="-70">X</text>
      <text x="-70" y="-121">XI</text>
    </g>

    <!-- Hour markers -->
    <g fill="#ff69b4">
      <circle cx="0" cy="-155" r="3"/><circle cx="0" cy="155" r="3"/>
      <circle cx="155" cy="0" r="3"/><circle cx="-155" cy="0" r="3"/>
      <circle cx="110" cy="-110" r="2"/><circle cx="110" cy="110" r="2"/>
      <circle cx="-110" cy="-110" r="2"/><circle cx="-110" cy="110" r="2"/>
      <circle cx="60" cy="-143" r="2"/><circle cx="60" cy="143" r="2"/>
      <circle cx="-60" cy="-143" r="2"/><circle cx="-60" cy="143" r="2"/>
      <circle cx="143" cy="-60" r="2"/><circle cx="143" cy="60" r="2"/>
      <circle cx="-143" cy="-60" r="2"/><circle cx="-143" cy="60" r="2"/>
    </g>

    <!-- Clock hands -->
    <line x1="0" y1="5" x2="0" y2="-110" stroke="#dc143c" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="90" y2="-40" stroke="#ff69b4" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#ff69b4"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
  </g>

  <!-- Floating Gears -->
  <g opacity="0.15" transform="translate(150, 320)">
    <circle r="40" fill="none" stroke="#dc143c" stroke-width="2"/>
    <circle r="8" fill="#dc143c"/>
    <g stroke="#dc143c" stroke-width="2">
      <line x1="0" y1="-40" x2="0" y2="-50"/><line x1="0" y1="40" x2="0" y2="50"/>
      <line x1="-40" y1="0" x2="-50" y2="0"/><line x1="40" y1="0" x2="50" y2="0"/>
    </g>
  </g>
  <g opacity="0.1" transform="translate(1050, 80)">
    <circle r="25" fill="none" stroke="#ff69b4" stroke-width="1.5"/>
    <circle r="5" fill="#ff69b4"/>
    <g stroke="#ff69b4" stroke-width="1.5">
      <line x1="0" y1="-25" x2="0" y2="-32"/><line x1="0" y1="25" x2="0" y2="32"/>
      <line x1="-25" y1="0" x2="-32" y2="0"/><line x1="25" y1="0" x2="32" y2="0"/>
    </g>
  </g>

  <!-- Floating Particles -->
  <g fill="#dc143c" opacity="0.6">
    <circle cx="200" cy="100" r="2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="50" r="1.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="120" r="2"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="80" r="1.5"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="60" r="2"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="150" r="1.5"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#ff69b4" opacity="0.4">
    <circle cx="250" cy="200" r="1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="180" r="1.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="40" r="1"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="200" r="1.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Animated Heartbeat Line -->
  <g transform="translate(0, 380)">
    <rect x="0" y="-1" width="1200" height="2" fill="url(#subtleLine)" opacity="0.3"/>
    <path d="M0,0 Q20,0 40,0 Q50,0 60,-12 Q70,-25 80,0 Q90,25 100,12 Q110,0 120,0 L1200,0" 
          fill="none" stroke="#dc143c" stroke-width="1.5" opacity="0.5" stroke-dasharray="200 800">
      <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- === ANIME GIRL ILLUSTRATION === -->
  <g transform="translate(370, 195)">
    <!-- Body / Hoodie -->
    <path d="M-35,30 Q-40,60 -38,90 L-30,110 L-25,110 L-20,90 Q-15,70 -10,60 Q0,55 10,60 Q15,70 20,90 L25,110 L30,110 L38,90 Q40,60 35,30 Z" 
          fill="#1a0a0a" stroke="#ff69b4" stroke-width="1" stroke-opacity="0.3"/>
    <!-- Hoodie pink stripe -->
    <path d="M-38,90 L-30,110 M38,90 L30,110" stroke="#ff69b4" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <!-- Hoodie strawberry pattern - small pink dots -->
    <g fill="#ff69b4" opacity="0.3">
      <circle cx="-15" cy="45" r="2"/><circle cx="5" cy="50" r="2"/><circle cx="15" cy="70" r="1.5"/>
      <circle cx="-10" cy="65" r="1.5"/><circle cx="8" cy="85" r="2"/>
    </g>
    <!-- Hood -->
    <path d="M-40,10 Q-42,-5 -38,-15 Q-30,-30 -20,-35 Q-10,-38 0,-38 Q10,-38 20,-35 Q30,-30 38,-15 Q42,-5 40,10" 
          fill="#150808" stroke="#ff69b4" stroke-width="0.8" stroke-opacity="0.3"/>
    <!-- Hood edge outline -->
    <path d="M-40,10 Q0,15 40,10" fill="none" stroke="#ff69b4" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Head -->
    <circle cx="0" cy="-30" r="28" fill="#1a0a0a"/>
    <circle cx="0" cy="-30" r="28" fill="url(#pinkGlow)" opacity="0.3"/>
    <circle cx="0" cy="-30" r="28" fill="none" stroke="#ff69b4" stroke-width="0.5" opacity="0.3"/>

    <!-- Hair - long flowing black hair -->
    <path d="M-28,-30 Q-35,-35 -42,-20 Q-55,10 -48,50 Q-45,70 -40,80 Q-38,85 -35,80 Q-30,60 -32,30 Q-33,10 -30,-5 Q-28,-20 -26,-28" 
          fill="#0a0505" stroke="#2a0a0a" stroke-width="0.5"/>
    <path d="M28,-30 Q35,-35 42,-20 Q55,10 48,50 Q45,70 40,80 Q38,85 35,80 Q30,60 32,30 Q33,10 30,-5 Q28,-20 26,-28" 
          fill="#0a0505" stroke="#2a0a0a" stroke-width="0.5"/>
    <!-- Hair bangs -->
    <path d="M-20,-55 Q-15,-60 -8,-58 Q0,-56 2,-58 Q8,-60 12,-57 Q18,-54 20,-50" 
          fill="#0a0505" stroke="none"/>
    <path d="M-22,-50 Q-18,-56 -10,-54 Q-4,-52 0,-54 Q5,-52 10,-55 Q15,-52 22,-48" 
          fill="none" stroke="#0a0505" stroke-width="2"/>
    
    <!-- Side hair strands -->
    <path d="M-26,-30 Q-30,-32 -34,-25 Q-38,-15 -36,-5" fill="none" stroke="#0a0505" stroke-width="3" stroke-linecap="round"/>
    <path d="M26,-30 Q30,-32 34,-25 Q38,-15 36,-5" fill="none" stroke="#0a0505" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes - closed, soft smile -->
    <path d="M-12,-32 Q-8,-35 -4,-32" fill="none" stroke="#ff69b4" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M4,-32 Q8,-35 12,-32" fill="none" stroke="#ff69b4" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Soft blush -->
    <ellipse cx="-14" cy="-28" rx="5" ry="3" fill="#ff69b4" opacity="0.15"/>
    <ellipse cx="14" cy="-28" rx="5" ry="3" fill="#ff69b4" opacity="0.15"/>

    <!-- Mouth - soft smile -->
    <path d="M-3,-24 Q0,-22 3,-24" fill="none" stroke="#ff69b4" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

    <!-- Hair ribbon -->
    <path d="M10,-55 Q15,-58 12,-52" fill="none" stroke="#dc143c" stroke-width="2" stroke-linecap="round"/>
    <path d="M12,-52 Q18,-50 14,-48" fill="none" stroke="#dc143c" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms holding -->
    <path d="M-35,30 Q-45,50 -40,70 Q-38,80 -32,75" fill="none" stroke="#1a0a0a" stroke-width="6" stroke-linecap="round"/>
    <path d="M35,30 Q45,50 40,70 Q38,80 32,75" fill="none" stroke="#1a0a0a" stroke-width="6" stroke-linecap="round"/>
    <!-- Sleeve cuffs -->
    <path d="M-32,75 Q-28,78 -25,75" fill="none" stroke="#ff69b4" stroke-width="1" opacity="0.3"/>
    <path d="M32,75 Q28,78 25,75" fill="none" stroke="#ff69b4" stroke-width="1" opacity="0.3"/>

    <!-- === BLACK CAT ON HEAD === -->
    <g transform="translate(3, -62)">
      <!-- Cat body -->
      <ellipse cx="0" cy="-4" rx="14" ry="10" fill="#0a0505" stroke="#2a0a0a" stroke-width="0.5"/>
      <!-- Cat head -->
      <circle cx="0" cy="-16" r="8" fill="#0d0707"/>
      <!-- Cat ears -->
      <path d="M-7,-22 L-9,-30 L-3,-24" fill="#0d0707" stroke="#2a0a0a" stroke-width="0.3"/>
      <path d="M7,-22 L9,-30 L3,-24" fill="#0d0707" stroke="#2a0a0a" stroke-width="0.3"/>
      <!-- Inner ears -->
      <path d="M-6,-23 L-8,-28 L-4,-24" fill="#ff69b4" opacity="0.2"/>
      <path d="M6,-23 L8,-28 L4,-24" fill="#ff69b4" opacity="0.2"/>
      <!-- Cat eyes - closed -->
      <path d="M-3,-17 Q-1.5,-19 0,-17" fill="none" stroke="#ff69b4" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
      <path d="M0,-17 Q1.5,-19 3,-17" fill="none" stroke="#ff69b4" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
      <!-- Cat nose -->
      <circle cx="0" cy="-15" r="0.8" fill="#ff69b4" opacity="0.3"/>
      <!-- Cat tail -->
      <path d="M12,0 Q20,-5 22,-12 Q23,-16 20,-18" fill="none" stroke="#0d0707" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- === TITLE SECTION === -->
  <g transform="translate(70, 195)">
    <!-- Title with glow -->
    <text x="0" y="-20" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold" 
          fill="none" stroke="#dc143c" stroke-width="1" opacity="0.3" filter="url(#softGlow)">RHAN</text>
    <text x="0" y="-20" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold" 
          fill="url(#titleGrad)" filter="url(#glow)">RHAN</text>
    <text x="0" y="-20" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold" 
          fill="none" stroke="#ff69b4" stroke-width="0.5" opacity="0.5">RHAN</text>

    <!-- Decorative line under title -->
    <rect x="0" y="-5" width="320" height="1.5" fill="url(#subtleLine)"/>

    <!-- Subtitle -->
    <text x="2" y="18" font-family="'Courier New', monospace" font-size="18" fill="#dc143c" letter-spacing="6" opacity="0.8">
      FULLSTACK DEVELOPER
    </text>

    <!-- Terminal typing text -->
    <g transform="translate(2, 50)">
      <rect x="0" y="-12" width="280" height="28" rx="3" fill="#0a0000" stroke="#dc143c" stroke-width="0.5" opacity="0.6"/>
      <text x="8" y="8" font-family="'Courier New', monospace" font-size="12" fill="#ff69b4" opacity="0.7">
        <tspan fill="#dc143c">$</tspan> <tspan id="terminal-line">Building ideas...</tspan>
        <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2s" repeatCount="indefinite"/>
      </text>
      <!-- Blinking cursor -->
      <rect x="280" y="-8" width="6" height="18" fill="#ff69b4" opacity="0.8">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Decorative right-side UI elements -->
  <g transform="translate(1020, 80)" opacity="0.15">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="none" stroke="#dc143c" stroke-width="0.5"/>
    <text x="10" y="20" font-family="monospace" font-size="8" fill="#dc143c">UPTIME</text>
    <text x="10" y="40" font-family="monospace" font-size="14" fill="#ff69b4">99.97%</text>
    <circle cx="85" cy="15" r="3" fill="#ff69b4">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(1020, 150)" opacity="0.12">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="none" stroke="#dc143c" stroke-width="0.5"/>
    <text x="10" y="20" font-family="monospace" font-size="8" fill="#dc143c">LATENCY</text>
    <text x="10" y="40" font-family="monospace" font-size="14" fill="#ff69b4">8ms</text>
  </g>
  <g transform="translate(1020, 220)" opacity="0.12">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="none" stroke="#dc143c" stroke-width="0.5"/>
    <text x="10" y="20" font-family="monospace" font-size="8" fill="#dc143c">PROJECTS</text>
    <text x="10" y="40" font-family="monospace" font-size="14" fill="#ff69b4">12</text>
  </g>
</svg>