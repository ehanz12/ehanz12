<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d0008"/>
      <stop offset="100%" stop-color="#050005"/>
    </radialGradient>
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#dc143c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="50%" stop-color="#0a0000"/>
      <stop offset="100%" stop-color="#1a0505"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <rect width="400" height="400" fill="url(#clockGlow)"/>

  <!-- Floating clock motifs -->
  <g opacity="0.08">
    <circle cx="80" cy="100" r="30" fill="none" stroke="#ffd700" stroke-width="1"/>
    <circle cx="80" cy="100" r="2" fill="#ffd700"/>
    <line x1="80" y1="75" x2="80" y2="70" stroke="#ffd700" stroke-width="1.5"/>
    <line x1="80" y1="125" x2="80" y2="130" stroke="#ffd700" stroke-width="1.5"/>
    <line x1="55" y1="100" x2="50" y2="100" stroke="#ffd700" stroke-width="1.5"/>
    <line x1="105" y1="100" x2="110" y2="100" stroke="#ffd700" stroke-width="1.5"/>
    
    <circle cx="320" cy="280" r="25" fill="none" stroke="#ffd700" stroke-width="0.8"/>
    <circle cx="320" cy="280" r="2" fill="#ffd700"/>
    <line x1="320" y1="258" x2="320" y2="255" stroke="#ffd700" stroke-width="1"/>
    <line x1="320" y1="302" x2="320" y2="305" stroke="#ffd700" stroke-width="1"/>
    <line x1="298" y1="280" x2="295" y2="280" stroke="#ffd700" stroke-width="1"/>
    <line x1="342" y1="280" x2="345" y2="280" stroke="#ffd700" stroke-width="1"/>
  </g>

  <!-- Floating particles -->
  <g fill="#ffd700" opacity="0.06">
    <circle cx="120" cy="280" r="2"><animate attributeName="opacity" values="0.06;0.2;0.06" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="120" r="1.5"><animate attributeName="opacity" values="0.06;0.15;0.06" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="80" r="1.5"><animate attributeName="opacity" values="0.06;0.12;0.06" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- === KURUMI TOKISAKI === -->
  <g transform="translate(200, 215)">
    <!-- Gothic Lolita Dress -->
    <path d="M-38,20 Q-45,55 -42,90 L-35,110 L-25,115 L-18,105 Q-10,90 0,85 Q10,90 18,105 L25,115 L35,110 L42,90 Q45,55 38,20 Z" 
          fill="url(#dressGrad)" stroke="#dc143c" stroke-width="1" stroke-opacity="0.4"/>
    
    <!-- Ruffled skirt layers -->
    <path d="M-42,90 Q-35,95 -25,100 Q-15,104 -5,100 Q5,104 15,100 Q25,95 42,90" 
          fill="none" stroke="#dc143c" stroke-width="1.5" opacity="0.3"/>
    <path d="M-38,80 Q-25,86 -10,82 Q0,86 10,82 Q25,86 38,80" 
          fill="none" stroke="#ff69b4" stroke-width="1" opacity="0.2"/>
    
    <!-- Skirt ruffle details -->
    <g stroke="#dc143c" stroke-width="0.8" opacity="0.25" fill="none">
      <path d="M-42,90 Q-38,93 -35,90"/>
      <path d="M-35,90 Q-30,94 -25,90"/>
      <path d="M-25,90 Q-20,95 -15,90"/>
      <path d="M-5,90 Q0,95 5,90"/>
      <path d="M15,90 Q20,95 25,90"/>
      <path d="M25,90 Q30,94 35,90"/>
    </g>

    <!-- Corset/waist ribbon -->
    <path d="M-38,55 Q-25,60 0,62 Q25,60 38,55" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4"/>
    <rect x="-8" y="55" width="16" height="8" rx="3" fill="#dc143c" opacity="0.6"/>
    <circle cx="0" cy="59" r="2" fill="#ffd700" opacity="0.5"/>

    <!-- Head -->
    <circle cx="0" cy="-15" r="30" fill="#1a0a0a"/>
    <circle cx="0" cy="-15" r="30" fill="none" stroke="#dc143c" stroke-width="0.8" opacity="0.2"/>

    <!-- Long twin-tail hair (left) -->
    <path d="M-28,-15 Q-38,-20 -45,-5 Q-55,20 -50,55 Q-48,70 -44,65 Q-38,50 -40,25 Q-42,5 -38,-8 Q-35,-15 -30,-18" 
          fill="#0a0505"/>
    <path d="M-45,-5 Q-52,15 -55,35 Q-58,55 -52,70 Q-48,80 -44,72" 
          fill="#0a0505"/>
    <!-- Hair tie left -->
    <ellipse cx="-48" cy="22" rx="6" ry="4" fill="#dc143c" opacity="0.7"/>
    <path d="M-54,22 L-56,26 L-52,22" fill="#dc143c" opacity="0.5"/>

    <!-- Long twin-tail hair (right) -->
    <path d="M28,-15 Q38,-20 45,-5 Q55,20 50,55 Q48,70 44,65 Q38,50 40,25 Q42,5 38,-8 Q35,-15 30,-18" 
          fill="#0a0505"/>
    <path d="M45,-5 Q52,15 55,35 Q58,55 52,70 Q48,80 44,72" 
          fill="#0a0505"/>
    <!-- Hair tie right -->
    <ellipse cx="48" cy="22" rx="6" ry="4" fill="#dc143c" opacity="0.7"/>
    <path d="M54,22 L56,26 L52,22" fill="#dc143c" opacity="0.5"/>

    <!-- Hair bangs -->
    <path d="M-22,-42 Q-16,-46 -8,-44 Q0,-42 2,-44 Q10,-46 16,-43 Q22,-40 24,-36" 
          fill="#0a0505"/>
    <path d="M-24,-38 Q-18,-43 -10,-40 Q0,-38 10,-42 Q18,-43 24,-36" 
          fill="none" stroke="#0a0505" stroke-width="2"/>
    
    <!-- Side hair -->
    <path d="M-28,-15 Q-34,-18 -38,-10 Q-42,0 -40,8" fill="none" stroke="#0a0505" stroke-width="3" stroke-linecap="round"/>
    <path d="M28,-15 Q34,-18 38,-10 Q42,0 40,8" fill="none" stroke="#0a0505" stroke-width="3" stroke-linecap="round"/>

    <!-- Hair covering left eye (Kurumi's signature look) -->
    <path d="M-24,-38 Q-30,-36 -32,-28 Q-34,-18 -30,-8 Q-28,-2 -24,4 Q-20,8 -18,4" 
          fill="#0a0505" opacity="0.9"/>
    <path d="M-32,-28 Q-38,-20 -36,-10 Q-34,-2 -28,6" 
          fill="none" stroke="#0a0505" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Right eye (visible, golden/yellow) -->
    <g>
      <ellipse cx="10" cy="-18" rx="5" ry="6" fill="#110505"/>
      <ellipse cx="10" cy="-18" rx="4" ry="5" fill="#8b6914"/>
      <ellipse cx="10" cy="-18" rx="3" ry="4" fill="#ffd700" opacity="0.6"/>
      <circle cx="10" cy="-18" r="2" fill="#ffd700" opacity="0.8"/>
      <circle cx="11" cy="-19" r="1.5" fill="#fff" opacity="0.4"/>
      <!-- Clock eye detail -->
      <circle cx="10" cy="-18" r="4" fill="none" stroke="#dc143c" stroke-width="0.5" opacity="0.3"/>
      <line x1="10" y1="-22" x2="10" y2="-14" stroke="#dc143c" stroke-width="0.3" opacity="0.2"/>
      <line x1="6" y1="-18" x2="14" y2="-18" stroke="#dc143c" stroke-width="0.3" opacity="0.2"/>
    </g>

    <!-- Blush -->
    <ellipse cx="17" cy="-12" rx="5" ry="2.5" fill="#ff69b4" opacity="0.12"/>

    <!-- Small smirk -->
    <path d="M2,-8 Q5,-5 10,-7" fill="none" stroke="#ff69b4" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

    <!-- Head ribbon / headdress -->
    <g transform="translate(0, -42)">
      <path d="M-15,0 Q-8,-6 0,-8 Q8,-6 15,0" fill="none" stroke="#dc143c" stroke-width="2.5" opacity="0.6"/>
      <path d="M-8,-6 Q-4,-10 0,-8" fill="#dc143c" opacity="0.4"/>
      <path d="M8,-6 Q4,-10 0,-8" fill="#dc143c" opacity="0.4"/>
    </g>

    <!-- Arms posed elegantly -->
    <path d="M-38,20 Q-50,35 -48,55 Q-46,65 -40,62" fill="none" stroke="#1a0a0a" stroke-width="5" stroke-linecap="round"/>
    <path d="M38,20 Q50,35 48,55 Q46,65 40,62" fill="none" stroke="#1a0a0a" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Sleeve ruffles -->
    <g fill="none" stroke="#dc143c" stroke-width="0.8" opacity="0.3">
      <path d="M-46,50 Q-42,54 -40,50"/>
      <path d="M-44,55 Q-40,58 -38,55"/>
      <path d="M46,50 Q42,54 40,50"/>
      <path d="M44,55 Q40,58 38,55"/>
    </g>

    <!-- Hands -->
    <circle cx="-40" cy="62" r="4" fill="#1a0a0a" stroke="#dc143c" stroke-width="0.3" opacity="0.3"/>
    <circle cx="40" cy="62" r="4" fill="#1a0a0a" stroke="#dc143c" stroke-width="0.3" opacity="0.3"/>

    <!-- === ZAFKIEL (Clock) floating behind === -->
    <g transform="translate(0, -50)" opacity="0.15">
      <circle r="45" fill="none" stroke="#ffd700" stroke-width="1.5"/>
      <circle r="42" fill="none" stroke="#dc143c" stroke-width="0.5" stroke-dasharray="2,4"/>
      <circle r="2" fill="#ffd700"/>
      <line x1="0" y1="-42" x2="0" y2="-30" stroke="#ffd700" stroke-width="2"/>
      <line x1="0" y1="0" x2="20" y2="-15" stroke="#ffd700" stroke-width="1.5"/>
    </g>

    <!-- Gothic lolita choker -->
    <path d="M-18,-30 Q0,-27 18,-30" fill="none" stroke="#dc143c" stroke-width="2.5" opacity="0.5"/>
    <circle cx="0" cy="-29" r="3" fill="#ffd700" opacity="0.4"/>
    <circle cx="0" cy="-29" r="1.5" fill="#dc143c" opacity="0.5"/>
  </g>

  <!-- Decorative corner elements -->
  <g opacity="0.15">
    <path d="M15,15 L15,45 M15,15 L45,15" fill="none" stroke="#ffd700" stroke-width="1"/>
    <path d="M385,15 L385,45 M385,15 L355,15" fill="none" stroke="#ffd700" stroke-width="1"/>
    <path d="M15,385 L15,355 M15,385 L45,385" fill="none" stroke="#ffd700" stroke-width="1"/>
    <path d="M385,385 L385,355 M385,385 L355,385" fill="none" stroke="#ffd700" stroke-width="1"/>
  </g>
</svg>