<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d000a"/>
      <stop offset="100%" stop-color="#050005"/>
    </radialGradient>
    <radialGradient id="pinkRing" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="80%" stop-color="#ff69b4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff69b4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <rect width="400" height="400" fill="url(#pinkRing)"/>

  <!-- Floating hearts -->
  <g fill="#ff69b4" opacity="0.08">
    <path d="M80,80 Q85,75 90,80 Q95,75 100,80 Q100,88 90,95 Q80,88 80,80Z" transform="scale(0.8)"/>
    <path d="M80,80 Q85,75 90,80 Q95,75 100,80 Q100,88 90,95 Q80,88 80,80Z" transform="translate(300, 120) scale(0.6)"/>
    <path d="M80,80 Q85,75 90,80 Q95,75 100,80 Q100,88 90,95 Q80,88 80,80Z" transform="translate(100, 300) scale(0.5)"/>
    <path d="M80,80 Q85,75 90,80 Q95,75 100,80 Q100,88 90,95 Q80,88 80,80Z" transform="translate(280, 280) scale(0.7)"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ff69b4" opacity="0.1">
    <polygon points="320,60 322,66 328,66 323,70 325,76 320,72 315,76 317,70 312,66 318,66" transform="scale(0.8)"/>
    <polygon points="320,60 322,66 328,66 323,70 325,76 320,72 315,76 317,70 312,66 318,66" transform="translate(30, 200) scale(0.6)"/>
  </g>

  <!-- CHIBI ANIME GIRL -->
  <g transform="translate(160, 195)">
    <!-- Body - chibi proportions (big head, small body) -->
    <path d="M-22,25 Q-28,50 -25,70 L-18,80 L-12,80 L-8,70 Q-3,55 0,50 Q3,55 8,70 L12,80 L18,80 L25,70 Q28,50 22,25 Z" 
          fill="#1a0a0a" stroke="#ff69b4" stroke-width="0.5" stroke-opacity="0.3"/>
    
    <!-- Hoodie -->
    <path d="M-25,70 L-18,80 M25,70 L18,80" stroke="#ff69b4" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
    
    <!-- Little feet -->
    <ellipse cx="-10" cy="84" rx="8" ry="4" fill="#0a0505"/>
    <ellipse cx="10" cy="84" rx="8" ry="4" fill="#0a0505"/>

    <!-- Head (bigger for chibi) -->
    <circle cx="0" cy="-15" r="32" fill="#1a0a0a"/>
    <circle cx="0" cy="-15" r="32" fill="none" stroke="#ff69b4" stroke-width="0.5" opacity="0.2"/>

    <!-- Big chibi eyes -->
    <g opacity="0.8">
      <!-- Left eye -->
      <ellipse cx="-11" cy="-18" rx="7" ry="8" fill="#110505"/>
      <ellipse cx="-11" cy="-18" rx="6" ry="7" fill="#dc143c" opacity="0.3"/>
      <circle cx="-11" cy="-18" r="3.5" fill="#ff69b4" opacity="0.6"/>
      <circle cx="-9" cy="-20" r="1.5" fill="#fff" opacity="0.3"/>
      
      <!-- Right eye -->
      <ellipse cx="11" cy="-18" rx="7" ry="8" fill="#110505"/>
      <ellipse cx="11" cy="-18" rx="6" ry="7" fill="#dc143c" opacity="0.3"/>
      <circle cx="11" cy="-18" r="3.5" fill="#ff69b4" opacity="0.6"/>
      <circle cx="13" cy="-20" r="1.5" fill="#fff" opacity="0.3"/>
    </g>

    <!-- Cute smile -->
    <path d="M-4,-5 Q0,-2 4,-5" fill="none" stroke="#ff69b4" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Blush -->
    <ellipse cx="-16" cy="-10" rx="5" ry="3" fill="#ff69b4" opacity="0.15"/>
    <ellipse cx="16" cy="-10" rx="5" ry="3" fill="#ff69b4" opacity="0.15"/>

    <!-- Chibi hair - big, fluffy -->
    <path d="M-32,-15 Q-38,-22 -42,-8 Q-48,10 -44,35 Q-42,48 -38,52 Q-36,55 -34,50 Q-30,38 -32,20 Q-33,5 -30,-5 Q-28,-12 -25,-15" 
          fill="#0a0505"/>
    <path d="M32,-15 Q38,-22 42,-8 Q48,10 44,35 Q42,48 38,52 Q36,55 34,50 Q30,38 32,20 Q33,5 30,-5 Q28,-12 25,-15" 
          fill="#0a0505"/>
    
    <!-- Hair top volume -->
    <path d="M-20,-44 Q-15,-48 -8,-46 Q-2,-45 0,-46 Q4,-45 10,-47 Q15,-45 20,-42" fill="#0a0505"/>
    <path d="M-22,-40 Q-18,-44 -10,-42 Q-4,-41 0,-42 Q6,-41 12,-43 Q16,-42 22,-38" fill="none" stroke="#0a0505" stroke-width="2"/>

    <!-- Hair ribbon -->
    <g transform="translate(18, -42)">
      <path d="M0,0 Q5,-4 4,0 Q5,4 0,0" fill="#dc143c" opacity="0.7"/>
      <path d="M0,0 Q-4,-3 -3,0 Q-4,3 0,0" fill="#dc143c" opacity="0.7"/>
    </g>

    <!-- Small hands in lap -->
    <circle cx="-16" cy="55" r="5" fill="#1a0a0a"/>
    <circle cx="16" cy="55" r="5" fill="#1a0a0a"/>
  </g>

  <!-- === BLACK CAT === -->
  <g transform="translate(240, 240)">
    <!-- Cat body -->
    <ellipse cx="0" cy="-5" rx="22" ry="14" fill="#0a0505" stroke="#2a0a0a" stroke-width="0.5"/>
    
    <!-- Cat head -->
    <circle cx="18" cy="-20" r="12" fill="#0d0707"/>
    
    <!-- Cat ears -->
    <path d="M12,-29 L10,-40 L17,-32" fill="#0d0707" stroke="#2a0a0a" stroke-width="0.3"/>
    <path d="M24,-29 L26,-40 L19,-32" fill="#0d0707" stroke="#2a0a0a" stroke-width="0.3"/>
    <path d="M13,-30 L11,-38 L16,-32" fill="#ff69b4" opacity="0.15"/>
    <path d="M23,-30 L25,-38 L20,-32" fill="#ff69b4" opacity="0.15"/>
    
    <!-- Cat eyes - big cute anime style -->
    <ellipse cx="14" cy="-20" rx="4" ry="5" fill="#110505"/>
    <ellipse cx="14" cy="-20" rx="3" ry="4" fill="#ff69b4" opacity="0.3"/>
    <circle cx="14" cy="-20" r="2" fill="#dc143c" opacity="0.4"/>
    <circle cx="15" cy="-21" r="1" fill="#fff" opacity="0.3"/>
    
    <ellipse cx="22" cy="-20" rx="4" ry="5" fill="#110505"/>
    <ellipse cx="22" cy="-20" rx="3" ry="4" fill="#ff69b4" opacity="0.3"/>
    <circle cx="22" cy="-20" r="2" fill="#dc143c" opacity="0.4"/>
    <circle cx="23" cy="-21" r="1" fill="#fff" opacity="0.3"/>

    <!-- Cat nose -->
    <circle cx="18" cy="-16" r="1" fill="#ff69b4" opacity="0.3"/>
    
    <!-- Cat mouth -->
    <path d="M16,-15 Q18,-14 20,-15" fill="none" stroke="#ff69b4" stroke-width="0.5" opacity="0.3"/>

    <!-- Cat whiskers -->
    <g stroke="#ff69b4" stroke-width="0.3" opacity="0.2">
      <line x1="8" y1="-18" x2="1" y2="-20"/><line x1="8" y1="-16" x2="1" y2="-15"/>
      <line x1="28" y1="-18" x2="35" y2="-20"/><line x1="28" y1="-16" x2="35" y2="-15"/>
    </g>

    <!-- Cat tail -->
    <path d="M-20,0 Q-30,-5 -35,-15 Q-38,-22 -34,-25 Q-30,-28 -28,-22" 
          fill="none" stroke="#0d0707" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Cat paws -->
    <ellipse cx="12" cy="10" rx="4" ry="3" fill="#0d0707"/>
    <ellipse cx="22" cy="10" rx="4" ry="3" fill="#0d0707"/>
  </g>

  <!-- Chibi sparkle around them -->
  <g fill="#ff69b4" opacity="0.06">
    <circle cx="120" cy="260" r="4"><animate attributeName="opacity" values="0.06;0.15;0.06" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="150" r="3"><animate attributeName="opacity" values="0.06;0.12;0.06" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="140" r="2"><animate attributeName="opacity" values="0.06;0.1;0.06" dur="3s" repeatCount="indefinite"/></circle>
  </g>
</svg>